<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P2P Chat</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><h1>P2P Chat</h1><p id="identity">正在创建本机加密身份…</p></header>
<section class="card"><h2>私聊（直连 P2P）</h2><p class="hint">消息走浏览器之间的 WebRTC DataChannel；Workers 只保存 10 分钟的连接信令。</p><label>对方用户 ID <input id="peer-id" placeholder="粘贴对方 ID"></label><label>会话码 <input id="session-id" placeholder="发起方生成后分享"></label><div class="row"><button id="make-offer">发起连接</button><button id="accept-offer">接受连接</button></div><p id="p2p-state">未连接</p><div id="private-log" class="log"></div><div class="row"><input id="private-text" placeholder="连接后输入消息"><button id="send-private">发送</button></div></section>
<section class="card"><h2>群组（端到端加密中继）</h2><p class="hint">每条消息使用临时内容密钥加密。所有成员确认已收到密文后，才释放各自的密钥包；服务端不会获得明文或密钥。</p><div class="row"><input id="group-title" placeholder="新群名称"><button id="create-group">创建群</button><button id="refresh-groups">刷新</button></div><div id="groups" class="groups"></div><div id="group-panel" hidden><h3 id="group-name"></h3><p id="member-list" class="hint"></p><div class="row"><input id="add-member-id" placeholder="添加成员的用户 ID"><button id="add-member">添加</button></div><div id="group-log" class="log"></div><div class="row"><input id="group-text" placeholder="输入群消息"><button id="send-group">加密并发送</button></div></div></section>
<footer>首次打开会在此设备创建账户与密钥。请妥善保留浏览器数据；清除数据将无法解密旧消息。</footer></main><script type="module" src="/app.js"></script></body></html>
