<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P2P Chat</title><link rel="stylesheet" href="/style.css"></head><body>
<section id="auth-screen" class="auth-screen"><div class="auth-card"><div class="brand-mark">Q</div><h1>P2P Chat</h1><p id="auth-mode-hint">注册新账户，创建仅属于本机的加密身份</p><div class="auth-tabs"><button id="register-tab" class="active" type="button">注册</button><button id="login-tab" type="button">登录</button></div><div id="login-methods" class="auth-tabs login-methods" hidden><button id="password-method" class="active" type="button">密码登录</button><button id="code-method" type="button">验证码登录</button></div><label>邮箱<input id="email" type="email" autocomplete="email" placeholder="name@example.com"></label><label id="name-field">显示名称<input id="display-name" maxlength="40" placeholder="你的昵称"></label><label id="password-field">密码<input id="password" type="password" minlength="10" autocomplete="new-password" placeholder="至少 10 位"></label><div id="code-field" class="code-row"><input id="email-code" inputmode="numeric" maxlength="6" placeholder="6 位验证码"><button id="send-code" class="subtle">获取验证码</button></div><button id="sign-in" class="primary">完成注册</button><p id="auth-status" class="status"></p></div></section>
<div id="chat-app" class="qq-app" hidden>
  <aside class="rail"><div class="avatar" id="me-avatar">P</div><button class="rail-action active" aria-label="聊天">聊</button><button class="rail-action" aria-label="联系人">人</button><button class="rail-action bottom" id="logout" aria-label="退出">退</button></aside>
  <aside class="sidebar"><header class="sidebar-head"><div><strong id="me-name">P2P Chat</strong><small id="identity">在线</small></div><button id="new-group" title="新建群">新建</button></header><div class="search"><input id="group-title" placeholder="搜索或新建群聊"></div><div id="groups" class="conversation-list"></div></aside>
  <main class="conversation"><header class="conversation-head"><div class="head-avatar" id="current-avatar">P</div><div><strong id="group-name">选择一个群聊</strong><small id="member-list">端到端加密</small></div><button id="open-p2p" class="p2p-btn">新私聊</button></header><section id="empty-chat" class="empty-chat"><div class="empty-logo">P</div><h2>欢迎使用 P2P Chat</h2><p>私聊端到端直连；群聊加密扇出与收齐回执后解密。</p></section><section id="group-panel" class="message-area" hidden><div id="group-log" class="chat-log"></div><div class="composer"><input id="group-text" placeholder="输入消息，Enter 发送"><button id="send-group" class="primary">发送</button></div></section></main>
</div>
<dialog id="p2p-dialog"><form method="dialog" class="dialog-card"><button class="close">×</button><h2>发起 P2P 私聊</h2><p>将你的用户 ID 分享给联系人：<code id="my-id"></code></p><label>对方用户 ID<input id="peer-id" placeholder="粘贴对方 ID"></label><label>会话码<input id="session-id" placeholder="发起后自动生成"></label><div class="dialog-actions"><button type="button" id="make-offer" class="primary">发起连接</button><button type="button" id="accept-offer">接受连接</button></div><p id="p2p-state" class="status">未连接</p><p id="safety-code" class="safety-code" hidden></p><div id="private-log" class="chat-log short"></div><div class="composer"><input id="private-text" placeholder="连接后输入消息"><button type="button" id="send-private" class="primary">发送</button></div></form></dialog>
<dialog id="new-group-dialog"><form method="dialog" class="dialog-card"><button class="close">×</button><h2>创建群聊</h2><label>群名称<input id="new-group-title" maxlength="80" placeholder="例如：周末计划"></label><div class="dialog-actions"><button id="create-group" value="default" class="primary">创建</button></div></form></dialog><script type="module" src="/app.js"></script></body></html>
